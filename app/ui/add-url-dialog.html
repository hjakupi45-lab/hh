<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter new address to download</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 11.5px;
      background: #f0f0f0;
      color: #222;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .form-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .form-label {
      width: 70px;
      font-weight: 500;
      color: #333;
    }
    .form-input {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid #abadb3;
      border-radius: 2px;
      font-size: 11.5px;
      font-family: inherit;
    }
    .form-input:focus {
      outline: none;
      border-color: #0078d7;
    }
    .btn-browse {
      padding: 4px 10px;
      font-size: 11px;
      border: 1px solid #707070;
      border-radius: 2px;
      background: #e1e1e1;
      cursor: pointer;
    }
    .btn-browse:hover {
      background: #e5f1fb;
      border-color: #0078d7;
    }
    .dialog-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      min-width: 85px;
      padding: 5px 12px;
      font-size: 11.5px;
      font-weight: 500;
      border: 1px solid #8e8e8e;
      border-radius: 2px;
      background: linear-gradient(180deg, #ffffff 0%, #e6e6e6 100%);
      cursor: pointer;
    }
    .btn:hover {
      background: linear-gradient(180deg, #ffffff 0%, #d8e5f2 100%);
      border-color: #5c8fc2;
    }
    .btn-primary {
      font-weight: 600;
      border-color: #0078d7;
      background: linear-gradient(180deg, #f4f9ff 0%, #d3e5f8 100%);
    }
  </style>
</head>
<body>
  <div class="form-group">
    <label class="form-label">Address:</label>
    <input type="text" id="input-url" class="form-input" placeholder="http:// or https:// download link" autofocus>
  </div>

  <div class="form-group">
    <label class="form-label">Save As:</label>
    <input type="text" id="input-filename" class="form-input" placeholder="(Auto-detected from URL)">
  </div>

  <div class="form-group">
    <label class="form-label">Save To:</label>
    <input type="text" id="input-dir" class="form-input" readonly>
    <button class="btn-browse" id="btn-browse">Browse...</button>
  </div>

  <div class="form-group">
    <label class="form-label">Category:</label>
    <select id="select-category" class="form-input" style="max-width: 150px;">
      <option value="general">General</option>
      <option value="compressed">Compressed</option>
      <option value="documents">Documents</option>
      <option value="music">Music</option>
      <option value="programs">Programs</option>
      <option value="video">Video</option>
    </select>
  </div>

  <div class="dialog-footer">
    <button class="btn btn-primary" id="btn-start">OK</button>
    <button class="btn" id="btn-later">Download Later</button>
    <button class="btn" id="btn-cancel">Cancel</button>
  </div>

  <script src="add-url-dialog.js"></script>
</body>
</html>
