<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download Scheduler - Electron by Haris</title>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="assets/theme.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 11.5px;
      background: #f0f0f0;
      color: #222;
      padding: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      gap: 10px;
    }
    .banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, #eef6fd 0%, #dceaf8 100%);
      border: 1px solid #b6d4ee;
      border-radius: 4px;
      padding: 10px 12px;
    }
    .banner-icon { font-size: 22px; }
    .banner-title { font-weight: 600; color: #0f172a; }
    .banner-sub { color: #475569; font-size: 11px; }
    .card {
      background: #ffffff;
      border: 1px solid #c8c8c8;
      border-radius: 3px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .row { display: flex; align-items: center; gap: 10px; }
    .row > label { min-width: 140px; color: #333; }
    .row.indent { margin-left: 22px; }
    .form-input, select {
      padding: 4px 6px;
      border: 1px solid #abadb3;
      border-radius: 2px;
      font-size: 11.5px;
      font-family: inherit;
      background: #fff;
    }
    input[type="time"] { width: 110px; }
    select { width: 220px; }
    .status-line {
      margin-top: auto;
      font-size: 11px;
      color: #475569;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 3px;
      padding: 7px 9px;
    }
    .status-line b { color: #0f766e; }
    .status-line.off b { color: #b91c1c; }
    .footer { display: flex; justify-content: flex-end; gap: 8px; }
    .btn {
      min-width: 84px;
      padding: 5px 12px;
      font-size: 11.5px;
      font-weight: 500;
      border: 1px solid #8e8e8e;
      border-radius: 2px;
      background: linear-gradient(180deg, #ffffff 0%, #e6e6e6 100%);
      cursor: pointer;
    }
    .btn:hover { background: linear-gradient(180deg, #ffffff 0%, #d8e5f2 100%); border-color: #5c8fc2; }
    .btn-primary { font-weight: 600; border-color: #0078d7; background: linear-gradient(180deg, #f4f9ff 0%, #d3e5f8 100%); }
    .hint { color: #94a3b8; font-size: 10.5px; }
    input[disabled], select[disabled] { opacity: 0.55; }
  </style>
</head>
<body>
  <div class="banner">
    <div class="banner-icon">⏰</div>
    <div>
      <div class="banner-title">Download Scheduler</div>
      <div class="banner-sub">Start and stop the main download queue at set times, and take power actions when finished.</div>
    </div>
  </div>

  <div class="card">
    <label class="row">
      <input type="checkbox" id="chk-enable">
      <span style="font-weight:600;">Enable scheduled queue</span>
    </label>

    <div class="row indent">
      <label for="start-time">Start the queue at:</label>
      <input type="time" id="start-time" class="form-input" value="01:00">
    </div>
    <div class="row indent">
      <label for="on-start">When the queue starts:</label>
      <select id="on-start">
        <option value="resume-queue">Resume the main download queue</option>
        <option value="none">Do nothing</option>
      </select>
    </div>

    <div class="row indent">
      <label for="stop-time">Stop the queue at:</label>
      <input type="time" id="stop-time" class="form-input" value="06:00">
    </div>
    <div class="row indent">
      <label for="on-stop">When the queue stops:</label>
      <select id="on-stop">
        <option value="stop-queue">Stop the main download queue</option>
        <option value="exit-app">Exit Electron by Haris</option>
        <option value="shutdown">Turn off computer</option>
        <option value="hibernate">Hibernate computer</option>
        <option value="sleep">Sleep computer</option>
        <option value="none">Do nothing</option>
      </select>
    </div>

    <label class="row" style="margin-top:6px;">
      <input type="checkbox" id="chk-shutdown-complete">
      <span>Turn off computer when all downloads are complete</span>
    </label>

    <div class="status-line" id="status-line">Loading...</div>
  </div>

  <div class="footer">
    <button class="btn" id="btn-start-now" title="Immediately resume the main queue">Start Queue Now</button>
    <button class="btn btn-primary" id="btn-save">OK</button>
    <button class="btn" id="btn-cancel">Cancel</button>
  </div>

  <script src="scheduler-dialog.js"></script>
</body>
</html>
